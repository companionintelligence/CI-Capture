[package]
name = "CI-Applet"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
aws-config = "1"
aws-credential-types = "1"
aws-sdk-s3 = { version = "1", features = ["behavior-version-latest"] }
base64 = "0.21"
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
screenshots = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.29"
thiserror = "1"
tinyfiledialogs = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"] }
deadpool-postgres = "0.8"
tray-icon = "0.11"
uuid = { version = "1", features = ["v4", "serde"] }
egui = "0.33.2"
eframe = { version = "0.33.2", default-features = false, features = ["glow"] }
whoami = "1"
vizier = { path = "vizier" }
resvg = { version = "0.45", default-features = false, features = ["text"] }
usvg = "0.45"

# Phase 2 — file-activity watcher. See docs/plan/02-file-watcher.md.
notify = "8"
rusqlite = { version = "0.32", features = ["bundled"] }
globset = "0.4"
sha2 = "0.10"

# Phase 3 — Markdown conversion (text family). See docs/plan/03-conversion.md.
csv = "1"

# Phase 3 — rich extractors (html/eml/epub), opt-in via `--features rich-extractors`.
# Off by default to keep the standard build fast and dependency-light; the
# text/code/markdown/json/csv family covers the files users actually edit.
html2md = { version = "0.2", optional = true }
mail-parser = { version = "0.9", optional = true }
epub = { version = "2", optional = true }

[features]
default = []
rich-extractors = ["dep:html2md", "dep:mail-parser", "dep:epub"]

[dev-dependencies]
tempfile = "3"
