[package]
name = "companion-capture"
version = "0.2.0-alpha.7"
edition = "2024"

[dependencies]
anyhow = "1"
# Legacy MinIO upload path — heavy (pulls aws-lc-sys, which doesn't build on
# some MSVC toolchains) and rarely used. Off by default; enable with
# `--features legacy-minio`.
aws-config = { version = "1", optional = true }
aws-credential-types = { version = "1", optional = true }
aws-sdk-s3 = { version = "1", features = ["behavior-version-latest"], optional = true }
base64 = "0.21"
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
log = "0.4"
parking_lot = "0.12"
# rustls + ring (not aws-lc-rs) so it builds cleanly on every platform.
# Native roots let local CI-Server Caddy certificates work once trusted by the OS.
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls-native-roots-no-provider", "__rustls-ring", "blocking"] }
screenshots = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.29"
thiserror = "1"
tinyfiledialogs = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync", "net", "io-util"] }
# Legacy direct-to-Postgres writes — the applet used to talk to a database
# itself. Superseded by CI-Server ingest, which is the only path that keeps
# capture data on the user's own appliance behind an auth guard. Off by
# default; enable with `--features legacy-postgres`.
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4", "with-serde_json-1"], optional = true }
deadpool-postgres = { version = "0.8", optional = true }
tray-icon = "0.11"
uuid = { version = "1", features = ["v4", "serde"] }
egui = "0.33.2"
eframe = { version = "0.33.2", default-features = false, features = ["glow", "x11", "wayland"] }
# Matched to eframe's winit; used to promote helper windows out of LSUIElement.
winit = { version = "0.30", default-features = false }
whoami = "1"
vizier = { path = "vizier" }
resvg = { version = "0.45", default-features = false, features = ["text"] }
usvg = "0.45"

# Phase 2 — file-activity watcher. See docs/plan/02-file-watcher.md.
notify = "8"
rusqlite = { version = "0.32", features = ["bundled"] }
globset = "0.4"
sha2 = "0.10"

# Phase 3 — Markdown conversion (text family). See docs/plan/03-conversion.md.
csv = "1"

# Phase 3 — rich extractors (html/eml/epub), opt-in via `--features rich-extractors`.
# Off by default to keep the standard build fast and dependency-light; the
# text/code/markdown/json/csv family covers the files users actually edit.
html2md = { version = "0.2", optional = true }
mail-parser = { version = "0.9", optional = true }
epub = { version = "2", optional = true }
rust-i18n = "3"
# No transport feature on purpose. Sentry's own transport would pull a second
# reqwest (0.13) whose rustls enables the aws-lc-rs provider — which does not
# build on Windows MSVC (see the reqwest comment above) — and, more importantly,
# it would build a client without `.no_proxy()`, so an ambient HTTPS_PROXY could
# see crash payloads. `telemetry.rs` supplies a transport over this crate's own
# proxy-free client instead.
sentry = { version = "0.49.0", default-features = false, features = ["backtrace", "contexts", "panic"] }
sys-locale = "0.3.2"
auto-launch = "0.6.0"
fd-lock = "4.0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Activate an already-open Settings/Setup helper process from the tray.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
objc = "0.2"

# Off macOS the tray glyph is not a template image, so its colour has to be
# chosen to suit the panel; `dark-light` reads the desktop's light/dark
# preference (XDG settings portal on Linux/BSD, `AppsUseLightTheme` on
# Windows). See `svg_icon::tray_glyph_colour`.
[target.'cfg(not(target_os = "macos"))'.dependencies]
dark-light = "3.0.0"

# The Windows taskbar follows `SystemUsesLightTheme`, which `dark-light` does
# not read (it answers for *apps*); Windows 10's default is a dark taskbar
# with light apps, so the tray needs the taskbar's own switch. Already in the
# lock through `dark-light`, so this adds no new code to the build.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_StationsAndDesktops", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_SystemInformation"] }
winreg = "0.56"

# `org.freedesktop.ScreenSaver.GetActive` over the session bus is the
# closest thing to a universal lock-state query on Linux (GNOME, KDE and
# every xscreensaver-compatible frontend implement it); already resolved
# in the lock via `dark-light`'s own Linux path, so this adds no new
# code to the dependency graph, only a direct `use`. See `worker::is_locked`.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19.0", default-features = false, features = ["blocking"] }

# objc 0.2's macros probe a `cargo-clippy` cfg that isn't a crate feature.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }

[features]
default = []
# Direct Postgres access from the client. A laptop should not hold database
# credentials or open a plaintext (NoTls) connection to one — capture data goes
# through CI-Server. Retained only for legacy self-hosted setups.
legacy-postgres = ["dep:tokio-postgres", "dep:deadpool-postgres"]
rich-extractors = ["dep:html2md", "dep:mail-parser", "dep:epub"]
# Legacy screenshot upload straight to MinIO/S3 (bypasses CI-Server). Off by
# default — the server ingest path is the supported one.
#
# Implies `legacy-postgres`: the old flow wrote the bytes to MinIO *and* the row
# to Postgres, so `record_capture_legacy` needs the recorder. Note that the
# `ci.screen_captures` table it targets was dropped from CI-Server, so this path
# now writes to a table it re-creates itself and nothing reads.
legacy-minio = [
    "legacy-postgres",
    "dep:aws-config",
    "dep:aws-credential-types",
    "dep:aws-sdk-s3",
]

[dev-dependencies]
tempfile = "3"

# Native installers (.dmg / .msi / .nsis / .deb / .AppImage) via cargo-packager
# — https://github.com/crabnebula-dev/cargo-packager. Produces the same kind of
# distributables a Tauri app does, without making this a Tauri app.
[package.metadata.packager]
product-name = "Companion Capture"
identifier = "com.compint.CompanionCapture"
description = "Companion Capture — screen, activity & file capture that grows your Companion Memory"
long-description = "A lightweight cross-platform menu-bar / system-tray applet that grows your Companion Memory by capturing screen activity and the files you edit, and streaming them to your CI-Server."
authors = ["LifeScope Inc."]
publisher = "LifeScope Inc."
homepage = "https://github.com/companionintelligence/CI-Capture"
license-file = "LICENSE.md"
icons = [
  "packaging/icons/32x32.png",
  "packaging/icons/128x128.png",
  "packaging/icons/128x128@2x.png",
  "packaging/icons/icon.icns",
  "packaging/icons/icon.ico",
]
# Build the release binary (with rich extractors) before packaging.
before-packaging-command = "cargo build --release --features rich-extractors"

[package.metadata.packager.deb]
depends = [
  "libgtk-3-0",
  "libayatana-appindicator3-1",
  "libxdo3",
  "libxcb1",
]

[package.metadata.packager.macos]
minimum-system-version = "11.0"
# Inject LSUIElement (menu-bar accessory, no Dock icon) into the bundle plist.
info-plist-path = "packaging/macos/Info.plist"

[package.metadata.packager.nsis]
# Per-user install so no admin elevation is needed.
installer-mode = "currentUser"
