_version: 2

# Menu-bar (tray) labels and the message boxes the tray raises. Keys are
# namespaced by the surface that renders them so a string's home is obvious
# from its id alone.
#
# House style for Spanish:
#   - Address the user as "tú" (informal), matching the English copy's tone.
#   - "Companion Capture", "Companion Memory", "Companion Hub", "Portal" and
#     "CI-Server" are product names — never translated. "servidor de Companion
#     Memory" is the accepted form.
#   - Prefer the infinitive for menu commands ("Pausar", not "Pausa").
#   - Menu-bar items are read at a glance in a narrow strip: keep them short.

# --- Status line -----------------------------------------------------------

tray.status:
  en: "Status: %{state}"
  es: "Estado: %{state}"

tray.state_starting:
  en: Starting
  es: Iniciando

# The ⚠︎ prefix is the whole point of these states — keep it in every language.
tray.state_setup_needed:
  en: "⚠︎ Setup needed"
  es: "⚠︎ Falta configurar"

# Signed out / no API key — captures have nowhere authenticated to go.
tray.state_sign_in_needed:
  en: "⚠︎ Sign in to start"
  es: "⚠︎ Inicia sesión para empezar"

# Portal (or API key) is present, but no Companion Memory server URL yet.
tray.state_memory_disconnected:
  en: "⚠︎ Memory not connected"
  es: "⚠︎ Memory no conectada"

tray.state_backlog:
  en: "⚠︎ %{count} waiting to reach Memory"
  es: "⚠︎ %{count} esperando a Memory"

tray.state_device_pending:
  en: "⚠︎ Finishing device setup"
  es: "⚠︎ Terminando el dispositivo"

tray.state_permissions_needed:
  en: "⚠︎ Permissions needed"
  es: "⚠︎ Faltan permisos"

tray.state_monitoring:
  en: Monitoring
  es: Supervisando

tray.state_paused:
  en: Paused
  es: En pausa

# --- Capture commands ------------------------------------------------------

tray.pause_captures:
  en: Pause Captures
  es: Pausar capturas

tray.resume_captures:
  en: Resume Captures
  es: Reanudar capturas

tray.capture_now:
  en: Capture Now
  es: Capturar ahora

# Disabled variants: macOS greys the row out — the suffix is the only explanation
# the user can read without clicking. Keep short for a narrow menu.
tray.capture_now_needs_signin:
  en: "Capture Now — sign in first"
  es: "Capturar ahora — inicia sesión primero"

tray.capture_now_needs_memory:
  en: "Capture Now — connect Memory first"
  es: "Capturar ahora — conecta Memory primero"

tray.upload_document:
  en: Upload Document…
  es: Subir documento…

tray.upload_needs_signin:
  en: "Upload Document — sign in first"
  es: "Subir documento — inicia sesión primero"

tray.upload_needs_memory:
  en: "Upload Document — connect Memory first"
  es: "Subir documento — conecta Memory primero"

tray.open_memory:
  en: Open Companion Memory
  es: Abrir Companion Memory

tray.open_memory_needs_memory:
  en: "Open Companion Memory — not connected"
  es: "Abrir Companion Memory — no conectada"

tray.today_activity:
  en: Today's Activity
  es: Actividad de hoy

tray.today_needs_memory:
  en: "Today's Activity — not connected"
  es: "Actividad de hoy — no conectada"

