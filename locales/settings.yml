# ── Device activity (knowledge lane) ──────────────────────────────────────
# The lane reads macOS's own activity log (knowledgeC.db), which sits behind
# Full Disk Access. There is no system prompt for that grant — only the
# System Settings pane, and it takes effect on relaunch — so the copy says so.

settings.knowledge.label:
  en: Device activity
  es: Actividad del dispositivo

settings.knowledge.toggle.title:
  en: Record device activity
  es: Registrar la actividad del dispositivo

settings.knowledge.toggle.detail:
  en: Adds which apps you use and for how long, media you play, notifications you receive and Bluetooth devices you connect. Reads your Mac's own activity log, so it needs Full Disk Access.
  es: Añade qué apps usas y durante cuánto tiempo, el contenido que reproduces, las notificaciones que recibes y los dispositivos Bluetooth que conectas. Lee el registro de actividad de tu propio Mac, así que necesita Acceso total al disco.

settings.knowledge.fda.granted:
