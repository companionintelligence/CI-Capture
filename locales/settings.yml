_version: 2

# Settings window. Keys are namespaced by the surface that renders them so a
# string's home is obvious from its id alone.
#
# House style for Spanish:
#   - Address the user as "tú" (informal), matching the English copy's tone.
#   - "Companion Memory" and "Companion Capture" are product names — never
#     translated. "servidor de Companion Memory" is the accepted form.
#   - Prefer the infinitive for button labels ("Guardar", not "Guarda").

settings.language.system:
  en: Match my system
  es: Igual que mi sistema

settings.language.label:
  en: Language
  es: Idioma

# Per-OS siblings: `settings_ui::os_variant` renders `<key>.<os>` (macos /
# windows / linux, the std::env::consts::OS spelling) when it exists and the
# base key otherwise. The base must read correctly on any OS without a
# sibling. "Menu bar" is a Mac word — Windows calls it the system tray and
# most Linux desktops just "the tray".

settings.language.help:
  en: Save to apply this everywhere, including the menu bar.
  es: Guarda para aplicarlo en todas partes, incluida la barra de menús.

settings.language.help.windows:
  en: Save to apply this everywhere, including the system tray.
  es: Guarda para aplicarlo en todas partes, incluida la bandeja del sistema.

settings.language.help.linux:
  en: Save to apply this everywhere, including the tray.
  es: Guarda para aplicarlo en todas partes, incluida la bandeja.

