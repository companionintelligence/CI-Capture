name: Release

# Builds native installers for every platform with cargo-packager — the same
# kind of distributables a Tauri app produces (.dmg / .deb / .AppImage /
# .exe installer / Arch pacman package) — and publishes them to a GitHub
# Release.
#
# Cut a versioned release:
#   1. bump `version` in Cargo.toml, commit
#   2. git tag v0.1.0 && git push origin v0.1.0
#
# Pushes to main/master publish a prerelease named from Cargo.toml + run number.
# Manual runs build every package and upload the combined bundle as artifacts.

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15,       label: macOS (Apple Silicon), artifact: macos-arm64,   formats: dmg }
          - { os: ubuntu-22.04,   label: Ubuntu (x86_64),       artifact: ubuntu-x64,    formats: "deb,appimage" }
          - { os: ubuntu-22.04,   label: Arch Linux (x86_64),   artifact: arch-x64,      formats: pacman }
          - { os: windows-latest, label: Windows (x86_64),      artifact: windows-x64,   formats: nsis }
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxdo-dev libayatana-appindicator3-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libfuse2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-packager
        uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y cargo-packager

      - name: Build installers
        shell: bash
        env:
          # Ad-hoc sign on macOS (real Developer ID needs Apple secrets).
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
          # Let appimagetool run without a FUSE kernel module on the runner.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: cargo packager --release --formats ${{ matrix.formats }} --out-dir dist --verbose

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          find dist -maxdepth 2 -type f \
            \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.exe' -o -name '*.msi' -o -name '*.tar.gz' -o -name '*.pkg.tar.*' -o -name 'PKGBUILD' \) \
            -exec cp {} out/ \;
          ls -la out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.artifact }}
          path: out/*
          if-no-files-found: error

  release:
    name: publish
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ]; then
            version="$(sed -nE 's/^version = "([^"]+)"/\1/p' Cargo.toml | head -n 1)"
            short_sha="$(git rev-parse --short=12 HEAD)"
            tag="build-${{ github.ref_name }}-${version}.${{ github.run_number }}-${short_sha}"
            echo "version=v${version}+${{ github.ref_name }}.${{ github.run_number }}.${short_sha}" >> "$GITHUB_OUTPUT"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=v0.0.0-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          shasum -a 256 * > "CI-Applet-${{ steps.release.outputs.version }}-SHA256SUMS.txt"
          ls -la

      - name: Create GitHub Release
        if: steps.release.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: CI-Applet ${{ steps.release.outputs.version }}
          prerelease: ${{ steps.release.outputs.prerelease }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*

      - name: Upload combined dry-run bundle
        if: steps.release.outputs.publish != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: CI-Applet-${{ steps.release.outputs.version }}-installers
          path: artifacts/*
          if-no-files-found: error
