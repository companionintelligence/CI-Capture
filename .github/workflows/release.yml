name: Release

# Builds native installers for every platform with cargo-packager — the same
# kind of distributables a Tauri app produces (.dmg / .deb / .AppImage /
# .exe installer) — and publishes them to a GitHub Release.
#
# Cut a release:
#   1. bump `version` in Cargo.toml, commit
#   2. git tag v0.1.0 && git push origin v0.1.0
#
# Or run manually (Actions → Release → Run workflow) to dry-run the full build
# on all platforms: it produces the installers as artifacts but doesn't publish.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   label: macOS (Apple Silicon), formats: dmg }
          - { os: macos-13,       label: macOS (Intel),         formats: dmg }
          - { os: ubuntu-22.04,   label: Linux (x86_64),        formats: "deb appimage" }
          - { os: windows-latest, label: Windows (x86_64),      formats: nsis }
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxdo-dev libayatana-appindicator3-dev \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxcb-randr0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libfuse2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-packager
        uses: cargo-bins/cargo-binstall@main
      - run: cargo binstall -y cargo-packager

      - name: Build installers
        shell: bash
        env:
          # Ad-hoc sign on macOS (real Developer ID needs Apple secrets).
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
          # Let appimagetool run without a FUSE kernel module on the runner.
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: cargo packager --release --formats ${{ matrix.formats }} --out-dir dist --verbose

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          find dist -maxdepth 1 -type f \
            \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.exe' -o -name '*.msi' \) \
            -exec cp {} out/ \;
          ls -la out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: out/*
          if-no-files-found: error

  release:
    name: publish
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=v0.0.0-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        run: |
          cd artifacts
          shasum -a 256 * > "CI-Applet-${{ steps.ver.outputs.version }}-SHA256SUMS.txt"
          ls -la

      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: CI-Applet ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/*

      - name: Upload combined dry-run bundle
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: CI-Applet-${{ steps.ver.outputs.version }}-installers
          path: artifacts/*
          if-no-files-found: error
